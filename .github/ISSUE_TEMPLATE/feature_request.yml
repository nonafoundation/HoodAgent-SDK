name: Feature request
description: Suggest an API, vault, or improvement.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What are you trying to build, and what's missing?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed API"
      render: ts
  - type: checkboxes
    id: principles
    attributes:
      label: "Principles"
      options:
        - label: "The proposal keeps the SDK non-custodial (no signing, no key handling)."
          required: true
